<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Bob Corrigan — disc golf, friends, and good days on the course." />
  <meta property="og:title" content="Bob Corrigan" />
  <meta property="og:description" content="Disc golf, friends, and good days on the course." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bobcorrigan.com" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1714;
      --paper: #f0ebe3;
      --cream: #e8e0d4;
      --green: #d4f0d8;
      --green-dark: #c2e8c7;
      --muted: #8a8178;
      --rule: #c8bfb4;
    }

    html { scroll-behavior: smooth; }

    body {
      background: #b8b0a4;
      color: var(--ink);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      padding: 1.5rem;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='6' height='6' viewBox='0 0 6 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%239e968a' fill-opacity='0.15'%3E%3Crect width='1' height='1' x='0' y='0'/%3E%3Crect width='1' height='1' x='3' y='3'/%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ── Window ── */
    .mac-window {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0.5rem auto 1.5rem;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.15), inset 0 0 0 1px rgba(255,255,255,0.3);
    }

    .title-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      background: linear-gradient(180deg, #e8e2d8 0%, #d6d0c6 40%, #cac3b8 100%);
      border-bottom: 2px solid var(--ink);
      border-radius: 6px 6px 0 0;
      user-select: none;
    }

    .traffic-lights {
      position: absolute;
      left: 12px;
      display: flex;
      gap: 6px;
    }

    .traffic-dot {
      display: block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.2);
    }
    .traffic-dot.close { background: #ff6058; }
    .traffic-dot.minimize { background: #ffbd2e; }
    .traffic-dot.maximize { background: var(--green); }

    .wordmark {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink);
      text-decoration: none;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
      cursor: text;
    }

    /* PDGA button */
    .pdga {
      position: absolute;
      right: 10px;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.6rem 0.3rem 0.65rem;
      background: var(--green);
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      box-shadow: 2px 2px 0 var(--ink);
      color: var(--ink);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }
    .pdga:hover { background: var(--green-dark); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
    .pdga:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
    .pdga:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .pdga svg { width: 12px; height: 12px; }

    /* ── Photo wall ── */
    .wall {
      columns: 3 280px;
      column-gap: 14px;
      padding: 14px;
    }

    .shot {
      break-inside: avoid;
      margin-bottom: 14px;
      border: 1.5px solid var(--ink);
      background: var(--cream);
      box-shadow: 3px 3px 0 rgba(26,23,20,0.18);
      cursor: zoom-in;
      overflow: hidden;
      opacity: 0;
      transform: translateY(18px) rotate(var(--tilt, 0deg));
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.2,.8,.2,1), box-shadow 0.2s ease;
    }
    .shot.in { opacity: 1; transform: translateY(0) rotate(0deg); }
    .shot:hover { box-shadow: 6px 6px 0 rgba(26,23,20,0.22); transform: translate(-2px, -2px) rotate(var(--tilt, 0deg)); }

    .shot img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.4s ease;
    }
    .shot:hover img { transform: scale(1.03); }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(26,23,20,0.92);
      padding: 3.5rem 1rem;
      touch-action: pan-y;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border: 2px solid var(--paper);
      box-shadow: 6px 6px 0 rgba(0,0,0,0.4);
      animation: pop 0.25s ease;
    }
    .lb-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: var(--paper);
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      box-shadow: 2px 2px 0 var(--ink);
      color: var(--ink);
      cursor: pointer;
    }
    .lb-btn svg { width: 18px; height: 18px; }
    .lb-btn:hover { background: var(--green); }
    .lb-close { top: 12px; right: 12px; }
    .lb-prev { left: 12px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 12px; top: 50%; transform: translateY(-50%); }

    @keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

    @media (max-width: 600px) {
      body { padding: 0.6rem; }
      .mac-window { margin: 0 auto 0.6rem; }
      .wordmark { font-size: 0.85rem; }
      .traffic-lights { left: 10px; gap: 5px; }
      .traffic-dot { width: 9px; height: 9px; }
      .wall { columns: 2; column-gap: 8px; padding: 8px; }
      .shot { margin-bottom: 8px; box-shadow: 2px 2px 0 rgba(26,23,20,0.18); }
      .lb-prev, .lb-next { top: auto; bottom: 14px; transform: none; }
    }

    @media (max-width: 380px) {
      .wordmark { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .shot { opacity: 1; transform: none; transition: none; }
      .shot img, .lightbox img { transition: none; animation: none; }
    }
  </style>
</head>

    <img id="lbImg" alt="" />
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  <script>
    (function () {
      var shots = Array.prototype.slice.call(document.querySelectorAll('.shot'));

      // Playful tilt as each photo drops in
      shots.forEach(function (s, i) {
        s.style.setProperty('--tilt', ((i * 37) % 5 - 2) * 0.6 + 'deg');
      });

      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
          });
        }, { rootMargin: '0px 0px -40px 0px' });
        shots.forEach(function (s) { io.observe(s); });
      } else {
        shots.forEach(function (s) { s.classList.add('in'); });
      }

      // Lightbox
      var lb = document.getElementById('lightbox');
      var lbImg = document.getElementById('lbImg');
      var current = 0;

      function show(i) {
        current = (i + shots.length) % shots.length;
        var img = shots[current].querySelector('img');
        lbImg.src = img.src;
        lbImg.alt = img.alt;
        lbImg.style.animation = 'none'; void lbImg.offsetWidth; lbImg.style.animation = '';
      }
      function open(i) { show(i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
      function close() { lb.classList.remove('open'); document.body.style.overflow = ''; }

      shots.forEach(function (s, i) { s.addEventListener('click', function () { open(i); }); });
      document.getElementById('lbClose').addEventListener('click', close);
      document.getElementById('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); show(current - 1); });
      document.getElementById('lbNext').addEventListener('click', function (e) { e.stopPropagation(); show(current + 1); });
      lb.addEventListener('click', function (e) { if (e.target === lb) close(); });

      document.addEventListener('keydown', function (e) {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') show(current - 1);
        if (e.key === 'ArrowRight') show(current + 1);
      });

      // Swipe on phones
      var x0 = null;
      lb.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0;
        if (Math.abs(dx) > 40) show(current + (dx < 0 ? 1 : -1));
        x0 = null;
      });
    })();
  </script>
