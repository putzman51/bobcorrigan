  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1714;
      --paper: #f0ebe3;
      --cream: #e4dccf;
      --muted: #8a8178;
      --accent: #3d7a4c;
      --gap: 2in;          /* exactly 192px between photos */
      --col: 640px;
      --port-cap: min(78vh, 600px);
    }

    html { background: var(--paper); overflow-x: hidden; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Space Mono', ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* faint crosshatch, carried over from the old desktop pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='6' height='6' viewBox='0 0 6 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%239e968a' fill-opacity='0.15'%3E%3Crect width='1' height='1' x='0' y='0'/%3E%3Crect width='1' height='1' x='3' y='3'/%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .col {
      position: relative;
      z-index: 1;
      width: min(var(--col), 100% - 24px);
      margin: 0 auto;
    }

    /* ── Headline ── */
    h1 {
      padding-top: 56px;
      margin-bottom: var(--gap);
      text-align: center;
      font-size: 39px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0.02em;
      text-wrap: balance;
    }
    h1 a { color: inherit; text-decoration: none; cursor: text; }
    .sr {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    /* ── Photos ── */
    .frame {
      position: relative;
      margin-bottom: var(--gap);
    }

    .pic {
      position: relative;
      margin: 0 auto;
      background: var(--cream);
      border: 1.5px solid var(--ink);
      box-shadow: 4px 4px 0 rgba(26, 23, 20, 0.16);
    }
    .pic.land { width: 100%; }
    .pic.port { width: min(100%, calc(var(--port-cap) * var(--r))); }

    .pic img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* fade in only once fully loaded (JS on); no-JS shows photos straight away */
    .js .pic img { opacity: 0; transition: opacity 0.6s ease; }
    .js .pic img.is-loaded { opacity: 1; }

    .num {
      position: absolute;
      top: 0;
      right: 100%;
      margin-right: 14px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* caption lives inside the 2in gap, adds no height */
    figcaption {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      padding-top: 14px;
      text-align: center;
      font-size: 15px;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Footer ── */
    .foot {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 12px;
      line-height: 1.8;
      color: var(--muted);
      padding: 0 0 48px;
    }
    .foot a { color: var(--ink); text-underline-offset: 3px; }
    .foot a:hover { color: var(--accent); }
    .foot .copy { margin-top: 10px; font-size: 11px; }

    /* ── Full-screen view (desktop only) ── */
    @media (min-width: 701px) {
      .js .pic { cursor: zoom-in; }
    }

    .lb {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 40px 88px 28px;
      background: rgba(18, 16, 14, 0.94);
    }
    .lb.open { display: flex; }
    .lb img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 110px);
      width: auto;
      height: auto;
      object-fit: contain;
      border: 2px solid var(--paper);
    }
    .lb p {
      color: #cfe6d3;
      font-size: 14px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lb p span { color: #9a9086; margin-right: 10px; }

    .lb-btn {
      position: absolute;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      background: var(--paper);
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      box-shadow: 2px 2px 0 #000;
      color: var(--ink);
      cursor: pointer;
    }
    .lb-btn:hover { background: #d4f0d8; }
    .lb-btn:focus-visible { outline: 2px solid #d4f0d8; outline-offset: 3px; }
    .lb-btn svg { width: 18px; height: 18px; }
    .lb-close { top: 18px; right: 18px; }
    .lb-prev { left: 20px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 20px; top: 50%; transform: translateY(-50%); }

    /* ── Phones ── */
    @media (max-width: 700px) {
      h1 { font-size: 30px; padding-top: 40px; }
      figcaption { font-size: 13px; padding-top: 12px; }
      .pic { box-shadow: 3px 3px 0 rgba(26, 23, 20, 0.16); }
      .num { display: none; }
      .lb { display: none !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      .js .pic img { opacity: 1; transition: none; }
    }
  </style>

  <script>
    (function () {
      var roll = document.getElementById('roll');
      var frames = Array.prototype.slice.call(roll.querySelectorAll('.frame'));

      // ── Shuffle: new order every visit, never two of the same series side by side ──
      function rand(n) { return Math.floor(Math.random() * n); }
      function mix(list) {
        var left = list.slice(), out = [], last = null;
        for (var i = left.length - 1; i > 0; i--) { var j = rand(i + 1), t = left[i]; left[i] = left[j]; left[j] = t; }
        while (left.length) {
          var counts = {}, s, pool, k;
          left.forEach(function (f) { s = f.dataset.series; counts[s] = (counts[s] || 0) + 1; });
          var big = null;
          for (s in counts) { if (counts[s] > left.length / 2 && s !== last) { big = s; break; } }
          if (big) {
            pool = left.filter(function (f) { return f.dataset.series === big; });
          } else {
            pool = left.filter(function (f) { return f.dataset.series !== last; });
            if (!pool.length) pool = left;
          }
          var pick = pool[rand(pool.length)];
          left.splice(left.indexOf(pick), 1);
          out.push(pick);
          last = pick.dataset.series;
        }
        return out;
      }

      frames = mix(frames);
      frames.forEach(function (f, i) {
        roll.appendChild(f);
        f.querySelector('.num').textContent = (i < 9 ? '0' : '') + (i + 1);
        var img = f.querySelector('img');
        if (i < 2) { img.loading = 'eager'; img.setAttribute('fetchpriority', 'high'); }
        else { img.loading = 'lazy'; img.removeAttribute('fetchpriority'); }
      });

      // ── Fade in once each photo has fully loaded ──
      frames.forEach(function (f) {
        var img = f.querySelector('img');
        function done() { img.classList.add('is-loaded'); }
        if (img.complete && img.naturalWidth) done();
        else { img.addEventListener('load', done); img.addEventListener('error', done); }
      });

      document.getElementById('yr').textContent = new Date().getFullYear();

      // ── Full-screen view, desktop only ──
      var desk = window.matchMedia('(min-width: 701px)');
      var lb = document.getElementById('lb');
      var lbImg = document.getElementById('lbImg');
      var lbCap = document.getElementById('lbCap');
      var current = -1, opener = null;

      function show(i) {
        current = (i + frames.length) % frames.length;
        var f = frames[current], img = f.querySelector('img');
        lbImg.src = img.currentSrc || img.src;
        lbImg.alt = img.alt;
        lbCap.innerHTML = '';
        var n = document.createElement('span');
        n.textContent = f.querySelector('.num').textContent;
        lbCap.appendChild(n);
        lbCap.appendChild(document.createTextNode(f.querySelector('figcaption').textContent));
      }
      function open(i) {
        if (!desk.matches) return;
        opener = document.activeElement;
        show(i);
        lb.hidden = false;
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
        document.getElementById('lbClose').focus();
      }
      function close() {
        if (!lb.classList.contains('open')) return;
        lb.classList.remove('open');
        lb.hidden = true;
        document.body.style.overflow = '';
        frames[current].scrollIntoView({ block: 'center' });
        if (opener && opener.focus) opener.focus({ preventScroll: true });
      }

      frames.forEach(function (f) {
        f.querySelector('.pic').addEventListener('click', function () { open(frames.indexOf(f)); });
      });
      document.getElementById('lbClose').addEventListener('click', close);
      document.getElementById('lbPrev').addEventListener('click', function () { show(current - 1); });
      document.getElementById('lbNext').addEventListener('click', function () { show(current + 1); });
      lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
      document.addEventListener('keydown', function (e) {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowLeft') show(current - 1);
        else if (e.key === 'ArrowRight') show(current + 1);
      });
      desk.addEventListener && desk.addEventListener('change', function () { if (!desk.matches) close(); });
    })();
  </script>
