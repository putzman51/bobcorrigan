<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Out of bounds — Bob Corrigan</title>
  <script>
    // Catch /Disc, /DISC, /disc.html, /disc/ typos from the URL written on my discs.
    (function () {
      var p = location.pathname.toLowerCase().replace(/\/+$/, '').replace(/\.html?$/, '');
      if (p === '/disc' || p === '/disc/index' || p === '/found' || p === '/discs') {
        location.replace('/disc/');
      }
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #b8b0a4; color: #1a1714; font-family: 'Space Mono', monospace; min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    .box { max-width: 420px; width: 100%; background: #f0ebe3; border: 2px solid #1a1714; border-radius: 8px; box-shadow: 4px 4px 0 rgba(0,0,0,0.15); padding: 2rem 1.4rem; text-align: center; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p { margin-bottom: 1.2rem; }
    a { display: block; margin-top: 0.7rem; padding: 0.85rem; border: 2px solid #1a1714; border-radius: 6px; box-shadow: 3px 3px 0 #1a1714; background: #d4f0d8; color: #1a1714; font-weight: 700; text-decoration: none; }
    a.alt { background: #f0ebe3; }
  </style>
</head>
<body>
  <div class="box">
    <h1>OB! Page not found.</h1>
    <p>Take a penalty stroke and try one of these:</p>
    <a href="/disc/">Found my disc?</a>
    <a class="alt" href="/">bobcorrigan.com home</a>
  </div>
</body>
</html>
